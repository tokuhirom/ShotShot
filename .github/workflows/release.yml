name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Import Code-Signing Certificates
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.CERTIFICATES_P12 }}
          p12-password: ${{ secrets.CERTIFICATES_P12_PASSWORD }}

      - name: Build Release
        run: |
          xcodebuild build \
            -project shotshot.xcodeproj \
            -scheme shotshot \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            OTHER_CODE_SIGN_FLAGS="--timestamp" \
            ONLY_ACTIVE_ARCH=NO

      - name: Create zip for Notarization
        run: |
          cd build/Build/Products/Release
          ditto -c -k --keepParent ShotShot.app ShotShot.zip

      - name: Notarize app
        run: |
          # Submit and capture submission ID
          SUBMISSION_ID=$(xcrun notarytool submit build/Build/Products/Release/ShotShot.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait \
            --output-format json | jq -r '.id')

          echo "Submission ID: $SUBMISSION_ID"

          # Get detailed log
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}"

          # Check status
          xcrun notarytool info "$SUBMISSION_ID" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}"

      - name: Staple notarization ticket
        run: |
          xcrun stapler staple build/Build/Products/Release/ShotShot.app

      - name: Create final zip
        run: |
          cd build/Build/Products/Release
          zip -r "${GITHUB_WORKSPACE}/ShotShot.zip" ShotShot.app

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" ShotShot.zip --clobber
